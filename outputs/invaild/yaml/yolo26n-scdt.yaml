# YOLO26n + SCDT
# Semantic-Conditioned Detail Transport.
# Backbone P2 is used only as a high-resolution detail reservoir.
# Detect remains unchanged: P3/P4/P5.

nc: 80
end2end: True
reg_max: 1

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2-P2/4 detail reservoir
  - [-1, 1, Conv, [256, 3, 2]]                 # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]          # 4
  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                 # 6
  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]                # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]          # 9
  - [-1, 2, C2PSA, [1024]]                     # 10

head:
  # Standard top-down P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12
  - [-1, 2, C3k2, [512, True]]                 # 13

  # Standard top-down P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]]                  # 15
  - [-1, 2, C3k2, [256, True]]                 # 16 P3/8

  # Retrieve P2 sub-pixel details using P3 semantics.
  # Inputs: [backbone P2 detail reservoir, semantic P3]
  - [[2, 16], 1, SCDT, []]                     # 17 enhanced P3/8

  # Standard bottom-up PAN
  - [-1, 1, Conv, [256, 3, 2]]                 # 18
  - [[-1, 13], 1, Concat, [1]]                 # 19
  - [-1, 2, C3k2, [512, True]]                 # 20 P4/16

  - [-1, 1, Conv, [512, 3, 2]]                 # 21
  - [[-1, 10], 1, Concat, [1]]                 # 22
  - [-1, 1, C3k2, [1024, True, 0.5, True]]     # 23 P5/32

  - [[17, 20, 23], 1, Detect, [nc]]            # 24 Detect(P3,P4,P5)
