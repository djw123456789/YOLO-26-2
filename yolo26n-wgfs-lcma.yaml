# YOLO26n + WGFS + LCMA
# Innovation 1: WGFS preserves weak/small-target information during early sampling.
# Innovation 2: LCMA aligns top-down P4 semantics with the lateral P3 feature before fusion.
# Detect remains P3/P4/P5. No P2 detection head.

nc: 80
end2end: True
reg_max: 1

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26 backbone with WGFS stem
backbone:
  # WGFS internally performs the first two downsampling stages.
  # Output resolution: P2/4
  - [-1, 1, WGFS, [128]]                       # 0 P2/4

  - [-1, 2, C3k2, [256, False, 0.25]]          # 1

  - [-1, 1, Conv, [256, 3, 2]]                 # 2 P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]          # 3 lateral P3

  - [-1, 1, Conv, [512, 3, 2]]                 # 4 P4/16
  - [-1, 2, C3k2, [512, True]]                 # 5 lateral P4

  - [-1, 1, Conv, [1024, 3, 2]]                # 6 P5/32
  - [-1, 2, C3k2, [1024, True]]                # 7

  - [-1, 1, SPPF, [1024, 5, 3, True]]          # 8
  - [-1, 2, C2PSA, [1024]]                     # 9

# YOLO26 head with LCMA only at P4 -> P3 top-down fusion
head:
  # P5 -> P4 remains unchanged
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 5], 1, Concat, [1]]                  # 11 cat backbone P4
  - [-1, 2, C3k2, [512, True]]                 # 12 P4 semantic

  # P4 -> P3:
  # LCMA internally resizes layer 12 to layer 3 spatial size,
  # then performs lateral-conditioned local matching/alignment.
  - [[12, 3], 1, LCMA, []]                     # 13 aligned high-level P3
  - [[-1, 3], 1, Concat, [1]]                  # 14 cat aligned semantic + backbone P3
  - [-1, 2, C3k2, [256, True]]                 # 15 P3/8-small

  # Bottom-up PAN remains unchanged
  - [-1, 1, Conv, [256, 3, 2]]                 # 16
  - [[-1, 12], 1, Concat, [1]]                 # 17 cat head P4
  - [-1, 2, C3k2, [512, True]]                 # 18 P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]                 # 19
  - [[-1, 9], 1, Concat, [1]]                  # 20 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]]     # 21 P5/32-large

  # Detect remains P3 / P4 / P5
  - [[15, 18, 21], 1, Detect, [nc]]            # 22
